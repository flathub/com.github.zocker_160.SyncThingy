# shamelessly copied from https://github.com/flathub/org.freedesktop.Sdk.Extension.golang
name: golang1.26
modules:
  - name: golang
    buildsystem: simple
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://go.dev/dl/go1.26.8.linux-amd64.tar.gz
        sha256: d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b
      - type: archive
        only-arches:
          - aarch64
        url: https://go.dev/dl/go1.26.8.linux-arm64.tar.gz
        sha256: 211ffced9dcb9633a55eac6364816ec0ddd951389a740e88fa8b3337971bdda0
    build-commands:
      - install -d ${FLATPAK_DEST}/lib/sdk/golang
      - cp -rpv * ${FLATPAK_DEST}/lib/sdk/golang/

  - name: scripts
    sources:
      - type: script
        commands:
          - export GOROOT=${FLATPAK_DEST}/lib/sdk/golang
          - export PATH=$PATH:$GOROOT/bin
        dest-filename: enable.sh
    buildsystem: simple
    build-commands:
      - cp enable.sh ${FLATPAK_DEST}/lib/sdk/golang/
